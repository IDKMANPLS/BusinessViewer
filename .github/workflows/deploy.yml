name: Deploy Lovable Site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - run: ls -la
      - run: find . -maxdepth 2 -type d

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - uses: actions/deploy-pages@v4
